kind: AdaptiveDialog
beginDialog:
  kind: OnRedirect
  id: main
  actions:
    - kind: AdaptiveCardPrompt
      id: 8NF3jZ
      card: |-
        {
          "type": "AdaptiveCard",
          "$schema": "https://adaptivecards.io/schemas/adaptive-card.json",
          "version": "1.5",
          "body": [
            {
              "type": "TextBlock",
              "text": "Mock Submission - {Insert any message here}",
              "wrap": true
            },
            {
              "type": "TextBlock",
              "text": "Thank you for testing the International Support Form for Digital Equipment. Please leave your feedback if you have any on the form.",
              "wrap": true,
              "spacing": "Large"
            },
            {
              "type": "TextBlock",
              "text": "Best regards,",
              "wrap": true
            },
            {
              "type": "TextBlock",
              "text": "Brandon Chin",
              "wrap": true,
              "spacing": "None"
            },
            {
              "type": "TextBlock",
              "text": "Air Techniques",
              "wrap": true,
              "spacing": "None"
            },
            {
              "type": "ActionSet",
              "actions": [
                {
                  "type": "Action.Submit",
                  "title": "Start Feedback",
                  "style": "positive"
                },
                {
                  "type": "Action.Submit",
                  "title": "End Demo",
                  "style": "destructive"
                }
              ],
              "spacing": "Large",
              "horizontalAlignment": "Left"
            }
          ]
        }
      output:
        binding:
          actionSubmitId: Topic.feedbackForm

      outputType:
        properties:
          actionSubmitId: String

    - kind: ConditionGroup
      id: conditionGroup_weE5Pg
      conditions:
        - id: conditionItem_bmmUxX
          condition: =Topic.feedbackForm = "Start Feedback" || Topic.feedbackForm = "Feedback starten" || Topic.feedbackForm = "Iniciar comentarios" || Topic.feedbackForm = "フィードバックを開始" || Topic.feedbackForm = "피드백 시작" || Topic.feedbackForm = "开始反馈" || Topic.feedbackForm = "開始回饋"
          actions:
            - kind: BeginDialog
              id: C6mX0V
              dialog: brandon_Agent09232026.topic.wf9dev.Feedback

      elseActions:
        - kind: SetVariable
          id: setVariable_SioJTM
          variable: Global.feedbackData
          value: ="No Feedback Data"

    - kind: EndDialog
      id: Tk0LIe

inputType: {}
outputType: {}
