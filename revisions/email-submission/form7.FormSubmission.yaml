kind: AdaptiveDialog
beginDialog:
  kind: OnRedirect
  id: main
  actions:
    - kind: SetVariable
      id: initializeFeedbackData
      variable: Global.feedbackData
      value: =""

    - kind: SetTextVariable
      id: setFeedbackStartLabel
      variable: Topic.FeedbackStartLabel
      value: Start Feedback

    - kind: SetTextVariable
      id: setFeedbackEndLabel
      variable: Topic.FeedbackEndLabel
      value: Send without feedback

    - kind: AdaptiveCardPrompt
      id: 8NF3jZ
      card: |-
        ={
          type: "AdaptiveCard",
          '$schema': "https://adaptivecards.io/schemas/adaptive-card.json",
          version: "1.5",
          body: [
            {
              type: "TextBlock",
              text: "Your support request is ready to send.",
              wrap: true
            },
            {
              type: "TextBlock",
              text: "Add optional feedback, then we will send your support request. Or choose Send without feedback. The email includes your form details, and a copy goes to your contact email address.",
              wrap: true,
              spacing: "Large"
            },
            {
              type: "TextBlock",
              text: "Best regards,",
              wrap: true
            },
            {
              type: "TextBlock",
              text: "Brandon Chin",
              wrap: true,
              spacing: "None"
            },
            {
              type: "TextBlock",
              text: "Air Techniques",
              wrap: true,
              spacing: "None"
            },
            {
              type: "ActionSet",
              actions: [
                {
                  type: "Action.Submit",
                  title: Topic.FeedbackStartLabel,
                  id: "Start Feedback",
                  data: {
                    actionSubmitId: "Start Feedback"
                  },
                  style: "positive"
                },
                {
                  type: "Action.Submit",
                  title: Topic.FeedbackEndLabel,
                  id: "End Demo",
                  data: {
                    actionSubmitId: "End Demo"
                  },
                  style: "default"
                }
              ],
              spacing: "Large",
              horizontalAlignment: "Left"
            }
          ]
        }
      output:
        binding:
          actionSubmitId: Topic.feedbackForm

      outputType:
        properties:
          actionSubmitId: String

    - kind: SetVariable
      id: captureRawFeedbackAction
      variable: Topic.RawFeedbackAction
      value: =Topic.feedbackForm

    - kind: SetVariable
      id: normalizeFeedbackAction
      variable: Topic.feedbackForm
      value: |-
        =With(
          { submitted: Lower(Trim(Topic.RawFeedbackAction)) },
          If(
            submitted = "start feedback" || submitted = Lower(Trim(Topic.FeedbackStartLabel)),
            "Start Feedback",
            submitted = "end demo" || submitted = Lower(Trim(Topic.FeedbackEndLabel)),
            "End Demo",
            Topic.RawFeedbackAction
          )
        )

    - kind: ConditionGroup
      id: conditionGroup_weE5Pg
      conditions:
        - id: conditionItem_bmmUxX
          condition: =Lower(Trim(Topic.feedbackForm)) = "start feedback"
          actions:
            - kind: BeginDialog
              id: C6mX0V
              dialog: brandon_Agent09232026.topic.wf9dev.Feedback

        - id: endDemoSelected
          condition: =Lower(Trim(Topic.feedbackForm)) = "end demo"
          actions:
            - kind: SetVariable
              id: setVariable_SioJTM
              variable: Global.feedbackData
              value: =""

      elseActions:
        - kind: SendActivity
          id: unknownSubmissionAction
          activity: "Submission action was not recognized: [{Topic.feedbackForm}]. Please select Start Feedback or Send without feedback on the current card."

        - kind: GotoAction
          id: retrySubmissionAction
          actionId: 8NF3jZ

    - kind: BeginDialog
      id: callEmailWorkflow
      dialog: brandon_Agent09232026.topic.helper5.EmailWorkflow

    - kind: EndDialog
      id: Tk0LIe

inputType: {}
outputType: {}
